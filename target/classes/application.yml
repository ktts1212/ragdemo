server:
  port: 8080

spring:
  application:
    name: ragdemo
  datasource:
    url: jdbc:postgresql://localhost:15432/ragdemo
    username: liyong
    password: 123456
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

rag:
  chat:
    # DeepSeek OpenAI-compatible API address.
    base-url: https://api.deepseek.com
    api-key: sk-c81eb996c1ec44a893921d5c2b6cd7b4
    model: deepseek-chat
  embedding:
    # Ollama OpenAI-compatible API address.
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: bge-m3:latest
