server:
  port: 8080

spring:
  application:
    name: ragdemo
  datasource:
    url: jdbc:postgresql://localhost:15432/ragdemo
    username: liyong
    password: 123456
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        retries: 3
        retry.backoff.ms: 1000
    consumer:
      group-id: rag-ingestion-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.ragdemo.*

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: rag-documents

rag:
  default-model: deepseek
  models:
    deepseek:
      provider: openai-compatible
      base-url: https://api.deepseek.com
      api-key: sk-c81eb996c1ec44a893921d5c2b6cd7b4
      model-name: deepseek-v4-flash
      temperature: 0.2

      # zhipu:
      #   provider: openai-compatible
      #   base-url: https://open.bigmodel.cn/api/paas/v4
      #   api-key: ${ZHIPU_API_KEY}
      #   model-name: glm-4-flash
      #   temperature: 0.2
      #   max-output-tokens: 2000

  embedding:
    # Ollama OpenAI-compatible API address.
    provider: openai-compatible
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: bge-m3:latest
    # bge-m3 returns 1024-dimensional embeddings. Keep this aligned with sql/init.sql.
    dimension: 1024
    # 批量 embedding 的批大小与可重试错误的重试次数（skill §13）
    batch-size: 32
    max-retries: 2
  parser:
    # 学术文献 PDF 解析后端：marker（主）/ grobid（legacy, 不再作为主链路）
    backend: marker
    # 入库解析模式默认值（第 2 级；上传参数 > 本配置 > 按扩展名/MIME 自动）
    # AUTO：PDF → 学术链路(Marker)；txt/md 等 → 通用链路
    parse-mode: auto
  marker:
    # Marker API（经 SSH Tunnel 访问远程服务：Windows 127.0.0.1:18001 → Linux marker-api）
    base-url: http://127.0.0.1:18001
    connect-timeout: 5s
    # Marker 解析论文可能数十秒到数分钟（默认 900s）
    read-timeout: 900s
  repair:
    # ReadingOrderRepair 扫描窗口与开关
    max-skip-blocks: 8
    transparent-noise-enabled: true
    figure-association-enabled: true
  grobid:
    # legacy：GROBID 已降级为 benchmark parser，不再作为主链路
    base-url: http://localhost:8070
    # 连接超时（默认 3s）
    connect-timeout: 3s
    # 读取超时：复杂论文解析可能很慢（默认 120s）
    read-timeout: 300s
    # 瞬时故障最大重试次数（503/超时/连接失败，默认 3）
    max-retries: 3
    # 重试间隔（默认 5s）
    retry-backoff: 5s
  chunk:
    max-chars: 800
    overlap-chars: 120
  # SectionAwareChunker：以 token 为单位的预算（与上方 legacy 的字符口径解耦）
  chunker:
    target-tokens: 700
    max-tokens: 1000
    min-tokens: 180
    overlap-tokens: 100
    # v1 默认关闭 overlap；且仅对同 Section 内的相邻 TEXT chunk 生效
    overlap-enabled: false
    header-include-title: true
  retrieval:
    top-k: 5
    min-score: 0.3
  query-rewrite:
    enabled: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
