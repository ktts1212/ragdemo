server:
  port: 8080

spring:
  application:
    name: ragdemo
  datasource:
    url: jdbc:postgresql://localhost:15432/ragdemo
    username: liyong
    password: 123456
    driver-class-name: org.postgresql.Driver
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        retries: 3
        retry.backoff.ms: 1000
    consumer:
      group-id: rag-ingestion-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.example.ragdemo.*

minio:
  endpoint: http://localhost:9000
  access-key: minioadmin
  secret-key: minioadmin
  bucket: rag-documents

rag:
  default-model: deepseek
  models:
    deepseek:
      provider: openai-compatible
      base-url: https://api.deepseek.com
      api-key: sk-c81eb996c1ec44a893921d5c2b6cd7b4
      model-name: deepseek-v4-flash
      temperature: 0.2

      # zhipu:
      #   provider: openai-compatible
      #   base-url: https://open.bigmodel.cn/api/paas/v4
      #   api-key: ${ZHIPU_API_KEY}
      #   model-name: glm-4-flash
      #   temperature: 0.2
      #   max-output-tokens: 2000

  embedding:
    # Ollama OpenAI-compatible API address.
    provider: openai-compatible
    base-url: http://localhost:11434/v1
    api-key: ollama
    model: bge-m3:latest
    # bge-m3 returns 1024-dimensional embeddings. Keep this aligned with sql/init.sql.
    dimension: 1024
  grobid:
    base-url: http://localhost:8070
    # 连接超时（默认 3s）
    connect-timeout: 3s
    # 读取超时：复杂论文解析可能很慢（默认 120s）
    read-timeout: 300s
    # 瞬时故障最大重试次数（503/超时/连接失败，默认 3）
    max-retries: 3
    # 重试间隔（默认 5s）
    retry-backoff: 5s
  chunk:
    max-chars: 800
    overlap-chars: 120
  retrieval:
    top-k: 5
    min-score: 0.3
  query-rewrite:
    enabled: true

logging:
  charset:
    console: UTF-8
    file: UTF-8
